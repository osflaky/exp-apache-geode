name: develop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
    steps:
    # Spotless enforces unix line endings; keep LF on checkout (Windows git defaults to CRLF)
    - name: Configure git line endings
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK 17
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        java-version: '17'
        distribution: 'liberica'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      with:
        gradle-version: wrapper
    - name: Run 'build install javadoc spotlessCheck rat checkPom 
        resolveDependencies pmdMain' with Gradle
      run: ./gradlew --console=plain --no-daemon build install javadoc 
        spotlessCheck rat checkPom resolveDependencies pmdMain -x test

    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
